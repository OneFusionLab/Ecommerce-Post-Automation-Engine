[project]
name = "scrape-engine"
version = "0.1.0"
description = "Scrape-and-Publish backend: extract product data from e-commerce URLs and publish to WordPress."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "python-slugify>=8.0.4",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
